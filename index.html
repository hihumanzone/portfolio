    <title>Riddhiman Kundal | Portfolio</title>
    <script>
      // Early Mobile Detection: redirect mobile screens to the full-screen native mobile portfolio
      (function() {
        try {
          const params = new URLSearchParams(window.location.search);
          const forceRetro = params.get('view') === 'retro' || params.get('desktop') === 'true';
          const isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent || '');
          const isSmallScreen = window.innerWidth <= 768;
          if ((isMobileDevice || isSmallScreen) && !forceRetro) {
            window.location.replace('portfolio.html' + window.location.search + window.location.hash);
          }
        } catch (e) {
          /* Fallback gracefully */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/monitor.css" />
  </head>
  <body>
    <!-- Orientation / Mobile Alert Message -->
    <aside id="portrait-alert" class="portrait-alert-banner hidden" role="alert">
      <div class="alert-icon-wrap">
        <svg class="rotate-device-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
          <path d="M12 18h.01" />
          <path d="M20 7v2" />
        </svg>
      </div>
      <div class="alert-content">
        <div class="alert-heading">MOBILE MODE AVAILABLE</div>
        <p class="alert-body">
          For the best experience on mobile screens, explore the native full-screen 3D summit.
        </p>
      </div>
      <div class="alert-actions">
        <a href="portfolio.html" class="alert-launch-btn">OPEN MOBILE</a>
        <button id="dismiss-portrait-alert" class="alert-dismiss-btn" aria-label="Dismiss notice">DISMISS</button>
      </div>
    </aside>

    <!-- 3D Three.js & CSS3D Mount Points -->
    <div id="css3d-container"></div>
    <div id="webgl-container"></div>

    <script type="module" src="/src/monitor.js"></script>
  </body>
